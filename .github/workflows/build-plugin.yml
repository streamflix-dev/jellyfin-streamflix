name: Build Jellyfin Plugin & Update Repository Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
      - 'manifest.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_VERSION: "0.5.1.0"
  PLUGIN_GUID: "7cc1a505-91f6-4661-b4f9-7eee8be33b19"
  PLUGIN_NAME: "StreamFlix"
  PLUGIN_OVERVIEW: "Netflix-style UI, server-verified Google Sign-In & Netflix profiles backed by real Jellyfin users"
  PLUGIN_DESCRIPTION: "Transforms Jellyfin Web into StreamFlix: a Netflix-style cinema UI with an animated show/film mosaic gate, server-verified Google Sign-In (signed sessions), and Netflix 'Who's watching?' profiles mapped to real Jellyfin users with PIN and per-profile Google account locks."
  PLUGIN_CHANGELOG: "v0.5.1: stability & reliability hardening — thread-safe profile state synchronization across concurrent household requests, constant-time PIN verification with bounded brute-force lockout memory pruning, ETag-cached /Branding/Css responses (304 Not Modified), automatic Jellyfin 12 case-insensitive username sanitization for profiles with symbols/emojis, and branding.xml fallback tag insertion | v0.5: initial public beta release."

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0, 9.0 & 10.0 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build & Package Plugin (Jellyfin 10.9/10.10, 10.11, 12.x)
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.zip
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"

          # target | targetAbi | zip suffix
          build_target() {
            local target="$1" abi="$2" suffix="$3"
            dotnet publish Jellyfin.Plugin.StreamFlix/Jellyfin.Plugin.StreamFlix.csproj \
              -c Release \
              -p:JellyfinTarget="${target}" \
              -p:StreamFlixVersion="${PLUGIN_VERSION}" \
              -o "out_${target}"

            mkdir -p "pkg_${target}"
            cp "out_${target}/Jellyfin.Plugin.StreamFlix.dll" "pkg_${target}/"
            jq -n \
              --arg guid "$PLUGIN_GUID" --arg name "$PLUGIN_NAME" \
              --arg description "$PLUGIN_DESCRIPTION" --arg overview "$PLUGIN_OVERVIEW" \
              --arg version "$PLUGIN_VERSION" --arg targetAbi "$abi" \
              --arg changelog "$PLUGIN_CHANGELOG" --arg timestamp "$TIMESTAMP" \
              '{guid:$guid,name:$name,description:$description,overview:$overview,owner:"StreamFlix",category:"General",version:$version,targetAbi:$targetAbi,changelog:$changelog,timestamp:$timestamp}' \
              > "pkg_${target}/meta.json"

            local zip="dist/Jellyfin.Plugin.StreamFlix_${PLUGIN_VERSION}_${suffix}.zip"
            rm -f "$zip"
            (cd "pkg_${target}" && zip -r "../${zip}" Jellyfin.Plugin.StreamFlix.dll meta.json)
            cp "$zip" "dist/Jellyfin.Plugin.StreamFlix_${suffix}.zip"
          }

          build_target jf12   "12.0.0.0"  "12.0.0"
          build_target jf1011 "10.11.0.0" "10.11.0"
          build_target jf109  "10.9.0.0"  "10.9.0"

      - name: Generate Jellyfin Repository manifest.json
        run: |
          set -euo pipefail
          entry() {
            local abi="$1" suffix="$2"
            local zip="dist/Jellyfin.Plugin.StreamFlix_${PLUGIN_VERSION}_${suffix}.zip"
            jq -n \
              --arg version "$PLUGIN_VERSION" --arg changelog "$PLUGIN_CHANGELOG" \
              --arg targetAbi "$abi" \
              --arg sourceUrl "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${zip}" \
              --arg checksum "$(md5sum "$zip" | awk '{print $1}')" \
              --arg timestamp "$TIMESTAMP" \
              '{version:$version,changelog:$changelog,targetAbi:$targetAbi,sourceUrl:$sourceUrl,checksum:$checksum,timestamp:$timestamp}'
          }

          # Highest ABI first: Jellyfin picks the first compatible entry for equal versions.
          VERSIONS="$(jq -s '.' \
            <(entry "12.0.0.0"  "12.0.0") \
            <(entry "10.11.0.0" "10.11.0") \
            <(entry "10.10.0.0" "10.9.0") \
            <(entry "10.9.0.0"  "10.9.0"))"

          jq -n \
            --arg guid "$PLUGIN_GUID" --arg name "$PLUGIN_NAME" \
            --arg overview "$PLUGIN_OVERVIEW" --arg description "$PLUGIN_DESCRIPTION" \
            --argjson versions "$VERSIONS" \
            '[{guid:$guid,name:$name,overview:$overview,description:$description,owner:"StreamFlix",category:"General",versions:$versions}]' \
            > manifest.json
          cat manifest.json

      - name: Commit Packaged Plugin Zips & Updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/ manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build v${PLUGIN_VERSION} plugin packages and update manifest.json [skip ci]"
            git push origin HEAD:main
          fi
