name: Build Jellyfin Plugin & Update Repository Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
      - 'manifest.json'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_VERSION: "0.7.0.0"
  PLUGIN_GUID: "7cc1a505-91f6-4661-b4f9-7eee8be33b19"
  PLUGIN_NAME: "StreamFlix"
  PLUGIN_OVERVIEW: "Netflix-style UI, Household Profiles, Guest Passes, Movie Night Matcher & Seerr Requests for Jellyfin"
  PLUGIN_DESCRIPTION: "Transforms Jellyfin Web into StreamFlix: a Netflix-style cinema UI with flexible Google/OIDC/Jellyfin sign-in, expiring QR Guest Passes, Movie Night Matcher, optional Seerr/Jellyseerr search requests, and 'Who's watching?' profiles mapped to real Jellyfin users."
  PLUGIN_CHANGELOG: "- Temporary Guest Passes: create expiring invite links & locally rendered QR codes locked to a single non-admin profile, with redemption caps and instant 1-click session revocation\n- Movie Night Matcher: pick 2+ household profiles to intersect unwatched titles (honoring strictest parental ratings & shared My Lists) and vote through a quick head-to-head tournament bracket\n- Seerr / Jellyseerr / Overseerr Integration: optional server-proxied media search & 1-click Movie / TV Season requests built seamlessly into StreamFlix Live Search\n- Major Security, Stability & Performance Overhaul: strict same-origin auth token guard, secret-masked AdminConfig API, Docker/reverse-proxy X-Forwarded-For rate-limit hardening, OIDC client_secret_basic + post fallback, strict-CSP artwork loading, race-free Live Search, video OSD track/pause fixes, and TV D-pad enhancements"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8.0, 9.0 & 10.0 SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build & Package Plugin (Jellyfin 10.9/10.10, 10.11, 12.x)
        run: |
          set -euo pipefail
          mkdir -p dist
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"

          # target | targetAbi | zip suffix
          build_target() {
            local target="$1" abi="$2" suffix="$3"
            dotnet publish Jellyfin.Plugin.StreamFlix/Jellyfin.Plugin.StreamFlix.csproj \
              -c Release \
              -p:JellyfinTarget="${target}" \
              -p:StreamFlixVersion="${PLUGIN_VERSION}" \
              -o "out_${target}"

            mkdir -p "pkg_${target}"
            cp "out_${target}/Jellyfin.Plugin.StreamFlix.dll" "pkg_${target}/"
            cp "Jellyfin.Plugin.StreamFlix/thumb.png" "pkg_${target}/thumb.png"
            jq -n \
              --arg guid "$PLUGIN_GUID" --arg name "$PLUGIN_NAME" \
              --arg description "$PLUGIN_DESCRIPTION" --arg overview "$PLUGIN_OVERVIEW" \
              --arg version "$PLUGIN_VERSION" --arg targetAbi "$abi" \
              --arg changelog "$PLUGIN_CHANGELOG" --arg timestamp "$TIMESTAMP" \
              '{guid:$guid,name:$name,description:$description,overview:$overview,owner:"StreamFlix",category:"General",version:$version,targetAbi:$targetAbi,changelog:$changelog,timestamp:$timestamp,imagePath:"thumb.png"}' \
              > "pkg_${target}/meta.json"

            local zip="dist/Jellyfin.Plugin.StreamFlix_${PLUGIN_VERSION}_${suffix}.zip"
            rm -f "$zip"
            (cd "pkg_${target}" && zip -r "../${zip}" Jellyfin.Plugin.StreamFlix.dll meta.json thumb.png)
            cp "$zip" "dist/Jellyfin.Plugin.StreamFlix_${suffix}.zip"
          }

          build_target jf12   "12.0.0.0"  "12.0.0"
          build_target jf1011 "10.11.0.0" "10.11.0"
          build_target jf109  "10.9.0.0"  "10.9.0"

      - name: Update Jellyfin Repository manifest.json (Preserve Revision History)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["PLUGIN_VERSION"]
          changelog = os.environ["PLUGIN_CHANGELOG"].strip()
          timestamp = os.environ["TIMESTAMP"]
          guid = os.environ["PLUGIN_GUID"]
          name = os.environ["PLUGIN_NAME"]
          overview = os.environ["PLUGIN_OVERVIEW"]
          description = os.environ["PLUGIN_DESCRIPTION"]

          manifest_path = pathlib.Path("manifest.json")
          existing_versions = []
          if manifest_path.exists():
              try:
                  data = json.loads(manifest_path.read_text(encoding="utf-8"))
                  if isinstance(data, list) and data and isinstance(data[0].get("versions"), list):
                      existing_versions = [
                          v for v in data[0]["versions"]
                          if v.get("version") != version
                      ]
              except Exception:
                  existing_versions = []

          targets = [
              ("12.0.0.0",  "12.0.0",  "Build for Jellyfin 12.x (.NET 10)."),
              ("10.11.0.0", "10.11.0", "Build for Jellyfin 10.11.x (.NET 9)."),
              ("10.9.0.0",  "10.9.0",  "Build for Jellyfin 10.9 - 10.10 (.NET 8)."),
          ]

          new_entries = []
          for abi, suffix, label in targets:
              zip_rel = f"dist/Jellyfin.Plugin.StreamFlix_{version}_{suffix}.zip"
              md5 = hashlib.md5(pathlib.Path(zip_rel).read_bytes()).hexdigest()
              new_entries.append({
                  "version": version,
                  "changelog": f"{label}\n\n{changelog}",
                  "targetAbi": abi,
                  "sourceUrl": f"https://raw.githubusercontent.com/{repo}/main/{zip_rel}",
                  "checksum": md5,
                  "timestamp": timestamp,
              })

          abi_rank = {"12.0.0.0": 3, "10.11.0.0": 2, "10.10.0.0": 1, "10.9.0.0": 0}
          def sort_key(entry):
              ver_parts = tuple(int(x) for x in str(entry.get("version", "0.0.0.0")).split("."))
              return (ver_parts, abi_rank.get(entry.get("targetAbi", ""), -1))

          merged = sorted(new_entries + existing_versions, key=sort_key, reverse=True)

          manifest = [{
              "guid": guid,
              "name": name,
              "overview": overview,
              "description": description,
              "owner": "StreamFlix",
              "category": "General",
              "imageUrl": f"https://raw.githubusercontent.com/{repo}/main/Jellyfin.Plugin.StreamFlix/thumb.png",
              "versions": merged,
          }]

          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Updated manifest.json with {len(merged)} entries (latest: {version}).")
          PY

      - name: Commit Packaged Plugin Zips & Updated manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/ manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): build v${PLUGIN_VERSION} plugin packages and update manifest.json [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create or Update Git Release Tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          version = os.environ["PLUGIN_VERSION"].strip()
          parts = version.split(".")
          tag = "v" + ".".join(parts[:3] if len(parts) == 4 and parts[3] == "0" else parts)

          manifest = json.loads(pathlib.Path("manifest.json").read_text(encoding="utf-8"))
          entries = {
              v["targetAbi"]: v
              for v in manifest[0]["versions"]
              if v.get("version") == version
          }
          raw_cl = entries["12.0.0.0"]["changelog"]
          bullets = raw_cl.split("\n\n", 1)[1] if "\n\n" in raw_cl else raw_cl

          notes = (
              f"## What's Changed in {tag}\n\n"
              f"{bullets}\n\n"
              f"### Packages & MD5 Checksums\n\n"
              f"| Jellyfin Server | Target ABI | Runtime | Asset | MD5 |\n"
              f"| :--- | :--- | :--- | :--- | :--- |\n"
              f"| **12.x** | `12.0.0.0` | .NET 10.0 | `Jellyfin.Plugin.StreamFlix_{version}_12.0.0.zip` | `{entries['12.0.0.0']['checksum']}` |\n"
              f"| **10.11.x** | `10.11.0.0` | .NET 9.0 | `Jellyfin.Plugin.StreamFlix_{version}_10.11.0.zip` | `{entries['10.11.0.0']['checksum']}` |\n"
              f"| **10.9.x – 10.10.x** | `10.9.0.0` | .NET 8.0 | `Jellyfin.Plugin.StreamFlix_{version}_10.9.0.zip` | `{entries['10.9.0.0']['checksum']}` |\n"
          )
          pathlib.Path("release_notes.md").write_text(notes, encoding="utf-8")

          zips = [
              f"dist/Jellyfin.Plugin.StreamFlix_{version}_12.0.0.zip",
              f"dist/Jellyfin.Plugin.StreamFlix_{version}_10.11.0.zip",
              f"dist/Jellyfin.Plugin.StreamFlix_{version}_10.9.0.zip",
          ]

          # Create annotated git tag at HEAD if it does not already exist
          tag_exists = subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{tag}"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
          ).returncode == 0
          if not tag_exists:
              subprocess.run([
                  "git", "-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "tag", "-a", tag, "HEAD", "-m", f"StreamFlix {tag} ({version})\n\n{bullets}"
              ], check=True)
              subprocess.run(["git", "push", "origin", tag], check=True)

          # Create or update GitHub Release
          rel_exists = subprocess.run(
              ["gh", "release", "view", tag],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
          ).returncode == 0
          if rel_exists:
              subprocess.run([
                  "gh", "release", "edit", tag,
                  "--title", f"StreamFlix {tag} ({version})",
                  "--notes-file", "release_notes.md"
              ], check=True)
              subprocess.run(["gh", "release", "upload", tag, "--clobber", *zips], check=True)
          else:
              subprocess.run([
                  "gh", "release", "create", tag, *zips,
                  "--title", f"StreamFlix {tag} ({version})",
                  "--notes-file", "release_notes.md",
                  "--latest"
              ], check=True)
          PY
