overview: "Netflix-style UI, server-verified Google Sign-In & Netflix profiles backed by real Jellyfin users"
description: >
  Transforms Jellyfin Web into StreamFlix with a Netflix #141414 dark cinema UI,
  a server-verified Google Sign-In gate (signed, revocable household sessions checked
  against the ApprovedGoogleAccounts allowlist), and Netflix "Who's watching?" profiles
  backed by real Jellyfin Server Users so every profile has its own independent Watch
  History, Continue Watching, Next Up, and Favorites. Profiles can be protected with a
  PIN and/or locked to a single Google account.
