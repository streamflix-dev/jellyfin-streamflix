changelog: >
  - Simplified Progressive-Disclosure Settings: clean, compact configuration cards that stay collapsed until each sign-in method or feature (Google OAuth, Jellyfin Password, Admin Fallback, LAN Bypass, Guest Passes, Hero Advanced Filters, Seerr, Custom OIDC) is enabled
  - Toggleable Guest Passes & Modal Fixes: add master EnableGuestPasses switch (hiding UI entry points and disconnecting active guest sessions when disabled) and fix sanitizeHexColor / expiry / unlimited-redemption rendering in the Guest Passes & Movie Night Matcher modals
